[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelroute"
version = "0.1.0"
description = "Core LLM gateway with routing, resilience, caching, and rate limiting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "google-genai==2.18.1",
    "jinja2>=3.1,<4.0",
    "openai>=3.0,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=8.0,<9.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
